services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadtracker
      POSTGRES_PASSWORD: leadtracker
      POSTGRES_DB: leadtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's DATABASE_URL to point at the compose network's
      # postgres service name rather than localhost.
      DATABASE_URL: postgresql+psycopg://leadtracker:leadtracker@postgres:5432/leadtracker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
