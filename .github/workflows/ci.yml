name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadtracker
          POSTGRES_PASSWORD: leadtracker
          POSTGRES_DB: leadtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check app tests

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://leadtracker:leadtracker@localhost:5432/leadtracker
          JWT_SECRET: ci-test-secret
        run: |
          pip install pytest-cov
          pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt || true
        # `|| true`: informational for a portfolio project — surfaces
        # advisories in the log without failing the build on every new CVE.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
